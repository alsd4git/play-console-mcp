services:
  play-console-mcp:
    build:
      context: .
    restart: unless-stopped
    init: true
    environment:
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?Set MCP_PUBLIC_URL to the public HTTPS /mcp URL}
      MCP_OAUTH_SECRET: ${MCP_OAUTH_SECRET:?Set MCP_OAUTH_SECRET}
      MCP_OAUTH_DATA_PATH: /data/remote-oauth.json
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_ALLOW_PUBLIC_BIND: "1"
      GOOGLE_OAUTH_CLIENT_CONFIG_PATH: /run/secrets/google_oauth_client
      GOOGLE_OAUTH_ALLOWED_EMAILS: ${GOOGLE_OAUTH_ALLOWED_EMAILS:?Set the allowed Google account}
      GOOGLE_PLAY_ALLOWED_PACKAGES: ${GOOGLE_PLAY_ALLOWED_PACKAGES:-}
      GOOGLE_PLAY_ALLOW_DESTRUCTIVE: ${GOOGLE_PLAY_ALLOW_DESTRUCTIVE:-0}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - oauth-data:/data
    secrets:
      - google_oauth_client
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  google_oauth_client:
    file: ${GOOGLE_OAUTH_CLIENT_FILE:?Set GOOGLE_OAUTH_CLIENT_FILE to the Web OAuth client JSON}

volumes:
  oauth-data:
